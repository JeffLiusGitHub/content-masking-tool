[project]
name = "maskingtool"
version = "1.2.0"
description = "Local content masking tool: reversible, deterministic masking of company/people names in MD/DOCX/PDF before sending to AI"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "markdown-it-py>=3.0",
    "python-docx>=1.1",
    "pymupdf>=1.24",
    "platformdirs>=4.0",
    "mcp>=1.2",
    "tkinterdnd2>=0.4",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-html>=4.1",
    "anyio>=4.0",
    "pyinstaller>=6.0",
]

[project.scripts]
maskingtool = "maskingtool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maskingtool"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ner: tests requiring a local NER model (skipped when model not installed)",
]
