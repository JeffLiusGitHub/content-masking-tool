name: build

# This workflow produces unsigned, test-only native installers for CI
# acceptance. It never creates or modifies a GitHub Release. Formal release
# publication remains disabled until production identities, signing,
# notarization, and the final release gate are implemented.
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build and test (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build frozen server and legacy test artifacts
        shell: pwsh
        run: packaging/pyinstaller/build_windows.ps1

      - name: Build unsigned test MSI
        shell: pwsh
        run: packaging/msi/build_windows_msi.ps1 -TestOnly

      - name: Test MSI install, reinstall, and uninstall
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem dist/content-masking-tool-windows-x64-*-unsigned-test-only.msi)
          $metadata = @(Get-ChildItem dist/content-masking-tool-windows-x64-*-unsigned-test-only.json)
          if ($msi.Count -ne 1 -or $metadata.Count -ne 1) {
            throw "Expected exactly one MSI and metadata file"
          }
          packaging/msi/test_windows_msi.ps1 `
            -MsiPath $msi[0].FullName `
            -MetadataPath $metadata[0].FullName

      - name: Upload Windows test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/content-masking-tool-win.mcpb
            dist/maskingtool-windows-standalone.zip
            dist/SHA256SUMS-windows.txt
            dist/content-masking-tool-windows-x64-*-unsigned-test-only.msi
            dist/content-masking-tool-windows-x64-*-unsigned-test-only.json
          if-no-files-found: error

  build-macos:
    name: Build and test (macOS ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frozen server and legacy test artifacts
        run: bash packaging/pyinstaller/build_macos.sh ${{ matrix.arch }}

      - name: Build unsigned test PKG
        run: bash packaging/pkg/build_macos_pkg.sh ${{ matrix.arch }} --test-only

      - name: Test PKG install, reinstall, and uninstall
        run: |
          shopt -s nullglob
          packages=(dist/content-masking-tool-macos-${{ matrix.arch }}-*-unsigned-test-only.pkg)
          metadata=(dist/content-masking-tool-macos-${{ matrix.arch }}-*-unsigned-test-only.json)
          if [[ ${#packages[@]} -ne 1 || ${#metadata[@]} -ne 1 ]]; then
            echo "ERROR: expected exactly one PKG and metadata file" >&2
            exit 1
          fi
          bash packaging/pkg/test_macos_pkg.sh "${packages[0]}" "${metadata[0]}"

      - name: Upload macOS test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts-${{ matrix.arch }}
          path: |
            dist/content-masking-tool-macos-${{ matrix.arch }}.mcpb
            dist/maskingtool-macos-${{ matrix.arch }}-standalone.zip
            dist/SHA256SUMS-macos-${{ matrix.arch }}.txt
            dist/content-masking-tool-macos-${{ matrix.arch }}-*-unsigned-test-only.pkg
            dist/content-masking-tool-macos-${{ matrix.arch }}-*-unsigned-test-only.json
          if-no-files-found: error
