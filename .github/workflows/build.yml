name: build

# Builds the frozen MCP server, Claude Desktop extension (.mcpb), and the
# standalone desktop ZIP for Windows and macOS by driving the existing
# packaging scripts. On a v* tag, each platform job attaches its own artifacts
# to the release for that tag (creating it on first upload). This is
# deliberately decoupled: the release publishes as soon as any platform is
# ready, and a slow/queued runner (notably the scarce macOS Intel runner) only
# delays its own assets — it never blocks the others.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # build_windows.ps1: uv sync --locked -> npm ci -> metadata check ->
      # pytest -> PyInstaller onedir -> frozen smoke test -> mcpb pack ->
      # standalone ZIP -> SHA256SUMS. uv reads .python-version (3.11).
      - name: Build Windows artifacts
        shell: pwsh
        run: packaging/pyinstaller/build_windows.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/content-masking-tool-win.mcpb
            dist/maskingtool-windows-standalone.zip
            dist/SHA256SUMS-windows.txt
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create the release on first upload; ignore if another job already did.
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" \
            dist/content-masking-tool-win.mcpb \
            dist/maskingtool-windows-standalone.zip \
            dist/SHA256SUMS-windows.txt \
            --clobber

  build-macos:
    name: Build (macOS ${{ matrix.arch }})
    # Build each architecture natively on its own runner: macos-13 is Intel
    # (x86_64), macos-14 is Apple Silicon (arm64). PyInstaller emits a binary
    # for the architecture of the runner it executes on, so no Rosetta/
    # emulation is involved.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build macOS artifacts (${{ matrix.arch }})
        run: bash packaging/pyinstaller/build_macos.sh ${{ matrix.arch }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts-${{ matrix.arch }}
          path: |
            dist/content-masking-tool-macos-${{ matrix.arch }}.mcpb
            dist/maskingtool-macos-${{ matrix.arch }}-standalone.zip
            dist/SHA256SUMS-macos-${{ matrix.arch }}.txt
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create the release on first upload; ignore if another job already did.
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" \
            "dist/content-masking-tool-macos-${{ matrix.arch }}.mcpb" \
            "dist/maskingtool-macos-${{ matrix.arch }}-standalone.zip" \
            "dist/SHA256SUMS-macos-${{ matrix.arch }}.txt" \
            --clobber
